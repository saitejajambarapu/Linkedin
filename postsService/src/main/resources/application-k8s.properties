spring.datasource.url= jdbc:postgresql://${DB_SERVER}:5432/${DB_NAME}
spring.datasource.username= ${DB_USERNAME}
spring.datasource.password= ${DB_PASSWORD}


eureka.client.register-with-eureka= false
eureka.client.fetch-registry= false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.kafka.bootstrap-servers= kafka:9092

USER-SERVICE_URI= http://user-service
POSTS-SERVICE_URI= http://posts-service
CONNECTIONS-SERVICE_URI= http://connections-service
NOTIFICATION-SERVICE_URI= http://kafka-notification
UPLOADER-SERVICE_URI= http://uploader-service