eureka.client:
  register-with-eureka: false
  fetch-registry: false

USER-SERVICE_URI: http://user-service
POSTS-SERVICE_URI: http://posts-service
CONNECTIONS-SERVICE_URI: http://connections-service
NOTIFICATION-SERVICE_URI: http://kafka-notification
UPLOADER-SERVICE_URI: http://uploader-service

#uses actuator to check the health
management:
  endpoints:
    web:
      exposure:
        include: "health,info"